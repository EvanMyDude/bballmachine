name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Unit tests (physics, scoring, flow, determinism)
        run: npm test
      - name: Balance check (ideal bot clears every level)
        run: node scripts/bot.mjs --ci

  # Build and deploy are separate jobs (GitHub's standard Pages layout): the
  # job boundary gives the uploaded artifact time to be indexed before the
  # deploy looks it up. Uploading and deploying in one job can race that
  # indexing ("No artifacts named github-pages were found").
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the static site (game files only, cache-stamped URLs)
        run: scripts/build-site.sh _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
